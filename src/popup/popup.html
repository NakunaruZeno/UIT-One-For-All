<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>UIT One For All</title>
  <link rel="stylesheet" href="./popup.css">
</head>
<body>
  <!-- Header -->
  <header class="popup-header">
    <div class="brand">
      <img src="../../assets/icons/Icon64.png" alt="UIT Logo" class="brand-logo">
      <div class="brand-text">
        <div class="brand-title-row">
          <span class="brand-title">UIT One For All</span>
          <span class="version-pill mono">v1.4</span>
        </div>
        <span class="brand-subtitle">Trợ lý học vụ &amp; đồng bộ Portal</span>
      </div>
    </div>
    <button id="btn-theme-toggle" class="icon-btn" title="Chuyển đổi giao diện Sáng / Tối" aria-label="Chuyển đổi giao diện">
      <svg id="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="4"></circle>
        <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"></path>
      </svg>
      <svg id="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" style="display: none;">
        <path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"></path>
      </svg>
    </button>
  </header>

  <!-- TKB & Account Status Strip -->
  <div class="status-strip">
    <div class="status-left">
      <span id="status-dot" class="status-dot"></span>
      <span id="account-status-text">Chưa cấu hình MSSV</span>
    </div>
    <span id="tkb-validity-badge" class="status-badge mono">Chưa đồng bộ</span>
  </div>

  <!-- Quick Portal Links -->
  <nav class="quick-links" aria-label="Liên kết nhanh UIT">
    <a href="https://portal.uit.edu.vn/sinh-vien" target="_blank" rel="noopener" class="quick-link" title="Mở Cổng thông tin Sinh viên">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
        <rect width="7" height="9" x="3" y="3" rx="1"></rect>
        <rect width="7" height="5" x="14" y="3" rx="1"></rect>
        <rect width="7" height="9" x="14" y="12" rx="1"></rect>
        <rect width="7" height="5" x="3" y="16" rx="1"></rect>
      </svg>
      <span>Portal</span>
    </a>
    <a href="https://courses.uit.edu.vn/" target="_blank" rel="noopener" class="quick-link" title="Mở Moodle Courses">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
        <path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"></path>
        <path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"></path>
      </svg>
      <span>Courses</span>
    </a>
    <a href="https://dkhp.uit.edu.vn/app" target="_blank" rel="noopener" class="quick-link" title="Mở Cổng Đăng ký học phần">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
        <path d="m9 11 3 3L22 4"></path>
        <path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"></path>
      </svg>
      <span>ĐKHP</span>
    </a>
    <a href="https://daa.uit.edu.vn/" target="_blank" rel="noopener" class="quick-link" title="Mở Cổng Đào tạo DAA">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
        <path d="M4 22h16a2 2 0 0 0 2-2V4a2 2 0 0 0-2-2H8a2 2 0 0 0-2 2v16a2 2 0 0 1-2 2Zm0 0a2 2 0 0 1-2-2v-9c0-1.1.9-2 2-2h2"></path>
        <path d="M18 14h-8M15 18h-5M10 6h8v4h-8V6Z"></path>
      </svg>
      <span>DAA</span>
    </a>
  </nav>

  <!-- Account Credentials Card -->
  <section class="card">
    <div class="section-header">
      <span class="section-title">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
          <rect width="18" height="11" x="3" y="11" rx="2" ry="2"></rect>
          <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
        </svg>
        Tài khoản UIT SSO
      </span>
      <span class="security-tag mono" title="Mật khẩu được mã hóa AES-GCM 256-bit cục bộ trên thiết bị">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z"></path>
          <path d="m9 12 2 2 4-4"></path>
        </svg>
        AES-256
      </span>
    </div>

    <div class="field-group">
      <label class="field-label" for="username">Mã số sinh viên</label>
      <div class="input-wrap">
        <input type="text" id="username" class="input-field mono" placeholder="VD: 24520001" autocomplete="username">
      </div>
    </div>

    <div class="field-group">
      <label class="field-label" for="password">Mật khẩu chứng thực</label>
      <div class="input-wrap">
        <input type="password" id="password" class="input-field with-action" placeholder="Nhập mật khẩu UIT..." autocomplete="current-password">
        <button type="button" id="btn-toggle-pass" class="input-action-btn" title="Hiện / Ẩn mật khẩu" aria-label="Hiện mật khẩu">
          <svg id="icon-eye" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
            <path d="M2.062 12.348a1 1 0 0 1 0-.696 10.75 10.75 0 0 1 19.876 0 1 1 0 0 1 0 .696 10.75 10.75 0 0 1-19.876 0"></path>
            <circle cx="12" cy="12" r="3"></circle>
          </svg>
          <svg id="icon-eye-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" style="display: none;">
            <path d="M10.733 5.076a10.744 10.744 0 0 1 11.205 6.575 1 1 0 0 1 0 .696 10.747 10.747 0 0 1-1.444 2.49"></path>
            <path d="M14.084 14.158a3 3 0 0 1-4.242-4.242"></path>
            <path d="M17.479 17.499a10.75 10.75 0 0 1-15.417-5.151 1 1 0 0 1 0-.696 10.75 10.75 0 0 1 4.446-5.143"></path>
            <path d="m2 2 20 20"></path>
          </svg>
        </button>
      </div>
    </div>

    <button id="btn-save-account" class="btn btn-subtle">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
        <path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"></path>
        <polyline points="17 21 17 13 7 13 7 21"></polyline>
        <polyline points="7 3 7 8 15 8"></polyline>
      </svg>
      <span>Lưu thông tin đăng nhập</span>
    </button>
  </section>

  <!-- Primary Actions -->
  <button id="btn-sync-now" class="btn btn-primary">
    <svg id="sync-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
      <path d="M21 12a9 9 0 0 0-9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"></path>
      <path d="M3 3v5h5"></path>
      <path d="M3 12a9 9 0 0 0 9 9 9.75 9.75 0 0 0 6.74-2.74L21 16"></path>
      <path d="M16 16h5v5"></path>
    </svg>
    <span id="sync-btn-label">Đồng bộ Điểm, TKB &amp; Lịch thi</span>
  </button>

  <button id="btn-open-dashboard" class="btn btn-dashboard">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
      <rect width="18" height="18" x="3" y="3" rx="2"></rect>
      <path d="M3 9h18M9 21V9"></path>
    </svg>
    <span>Mở Bảng điều khiển học vụ</span>
  </button>

  <div id="status-msg" class="feedback-msg"></div>

  <script src="../lib/crypto.js"></script>
  <script src="./popup.js"></script>
</body>
</html>
